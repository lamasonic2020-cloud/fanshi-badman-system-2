</style></head><body><header class="top"><div><b>凡氏可行</b> ／ 壞男系統 2.0</div><div>預判他的預判 ／ MODULE 01</div></header><main class="wrap"><section class="hero"><div class="ey">壞男系統 2.0 ／ 預判他的預判</div><h1>答案早就擺在那裡<br><span>妳一直不肯看</span></h1><p>第一篇｜關係驗屍室<br>這一篇只看大實話：他拿走多少，妳付出多少，他答應的事情做了多少。感覺先放旁邊，事實拿出來。</p></section><div class="rule"><b>填寫規則</b><p>只回答已經發生的事。少替他補理由。忙、受過傷、不會表達，都不能抵銷他做過的爛事。照實選，結果才有用。</p></div><div id="questions"></div><section class="supply"><small>妳白做了多少</small><h3>沒有名分，妳先給了哪些女朋友才會給的東西</h3><div class="checks" id="checks"></div></section><button id="submit" disabled>還有 8 題沒敢回答</button><section class="report" id="report"><div class="score"><div><small>妳在這段關係吃虧的程度</small><br><b id="total"></b></div><div><small>最後結果</small><h2 id="level"></h2><p id="summary"></p></div></div><div class="table" id="table"></div><div class="verdict"><small>凡氏判決</small><p id="verdict"></p></div><button class="again" onclick="location.reload()">重新測一次</button></section><div class="foot">壞男系統 2.0｜看他長期怎麼做。妳說「不」以後，他的反應會直接告訴妳答案。</div></main><script>
const Q=[['他有沒有說實話','他的行程、感情狀態、你們的關係，他交代得清楚嗎',['說得清楚，前後對得上','有時含糊，問了會回答','常常閃躲，答案一直變','妳連自己有沒有當小三都搞不清楚']],['規則有沒有雙標','他要妳專一、隨傳隨到，自己卻保留全部自由',['兩個人守同一套規則','偶爾出現雙標','大部分都由他說了算','妳守婦道，他到處挑菜']],['誰在撐這段關係','約會、聯絡、照顧、吵架後收拾殘局，通常是誰在做',['兩個人差不多','妳做得稍微多一點','大多是妳在撐','他只要呼吸，其他都妳做']],['妳拒絕時他怎麼做','妳拒絕見面、性要求，或要求把話說清楚，他怎麼反應',['接受，不報復','失望，但會尊重','盧妳、冷掉、讓妳內疚','暴怒、威脅、強迫、死纏爛打']],['他有沒有做到','他嘴上答應的事情，最後做了多少',['答應的事情都有做到','偶爾跳票，之後會補救','幹話很多，行動很少','嘴巴陪妳一輩子，週末兩小時都不給']],['他什麼時候找妳','他聯絡妳的時間和原因，通常是哪一種',['平常就會找，也會提前約','偶爾臨時，之後會補約','多半在半夜、喝醉、寂寞時','只在想打炮、想被照顧、缺錢或出事時']],['妳替他找多少理由','朋友提醒妳有問題時，妳通常怎麼回答',['我會回頭看他實際做了什麼','他最近真的比較忙','他受過傷，他不會表達','你們不懂，他對我很特別']],['妳敢不敢走','三個月後一切照舊，妳會怎麼做',['照原本說好的條件離開','再講最後一次','繼續等，賭他以後會變','我知道很爛，但我走不了']]];
const S=['隨傳隨到','只跟他發生關係','免費接住他的爛情緒','替他處理生活和工作','替他隱瞞你們的關係','借錢或幫他付錢','他臨時取消，妳連氣都不敢生','沒有名分，妳卻每天向他報備'],A=Array(8).fill(-1),C=Array(8).fill(false);const qe=document.querySelector('#questions');Q.forEach((q,i)=>{let x=document.createElement('section');x.className='q';x.innerHTML=`<div class="qh">0${i+1} ／ ${q[0]}</div><h3>${q[1]}</h3><div class="opts">${q[2].map((o,j)=>`<button data-i="${i}" data-v="${j}"><i>${j}</i>${o}</button>`).join('')}</div>`;qe.append(x)});document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;A[i]=+b.dataset.v;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');ready()});const ce=document.querySelector('#checks');S.forEach((s,i)=>{let l=document.createElement('label');l.innerHTML=`<input type="checkbox"> ${s}`;l.querySelector('input').onchange=e=>{C[i]=e.target.checked;l.classList.toggle('on',C[i])};ce.append(l)});function ready(){let n=A.filter(x=>x<0).length,bt=document.querySelector('#submit');bt.disabled=n>0;bt.textContent=n?`還有 ${n} 題沒敢回答`:'看結果，別再替他圓 →'}document.querySelector('#submit').onclick=()=>{let t=A.reduce((a,b)=>a+b,0)+C.filter(Boolean).length,L=t>=25?['妳已經被吃乾抹淨','他拿走女朋友能給的全部，責任一毛都沒付。妳每天累得像條狗，他偶爾回一句想妳，妳又繼續幹白工。']:t>=17?['妳吃了很多虧','他已經習慣妳會退、會等、會原諒。妳再不收手，他只會拿得更多。']:t>=9?['問題已經很明顯','妳還有機會停下來。下一次他又開空頭支票，直接看他做了什麼。']:['目前還算正常','兩個人的付出目前接近。繼續看長期行動，別因為幾次表現好就把判斷力交出去。'];total.innerHTML=t+'<i> / 32</i>';level.textContent=L[0];summary.textContent=L[1];table.innerHTML='<div class="row"><span>妳要看的事情</span><span>分數</span><span>直接講</span></div>'+Q.map((q,i)=>`<div class="row"><b>${q[0]}</b><strong>${A[i]} / 3</strong><span>${['目前沒有明顯問題','有問題，繼續看他怎麼做','同樣的爛事已經重複發生','情況很嚴重，別再吞'][A[i]]}</span></div>`).join('')+`<div class="row"><b>妳白做的事</b><strong>${C.filter(Boolean).length} / 8</strong><span>${C.filter(Boolean).length<2?'目前付出還算克制':C.filter(Boolean).length<5?'妳已經做了不少白工':'妳把女朋友該做的全包了，他連男朋友的責任都懶得裝'}</span></div>`;verdict.textContent=t>=17?'他已經知道妳再不爽也會留下。妳的底線每退一次，他就多拿一點。最後被榨乾的人是妳，他照樣拍拍屁股去找下一個。':'現在還來得及。盯著他的長期行動。偶爾對妳好幾天，抵不了他長期把妳晾在旁邊。';report.style.display='block';report.scrollIntoView({behavior:'smooth'})};
</script></body></html>
